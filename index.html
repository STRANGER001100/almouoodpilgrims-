    <!-- ================= SECURITY ================= -->
    <!-- CSP fallback for hosts that cannot set HTTP headers.
         Authoritative policy is sent via HTTP headers (_headers / vercel.json /
         .htaccess), which additionally enforce frame-ancestors and HSTS. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'self';
               object-src 'none';
               form-action 'self';
               script-src 'self' 'unsafe-inline';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src 'self' data: https://fonts.gstatic.com;
               img-src 'self' data: https://i.ibb.co;
               connect-src 'self';
               upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
